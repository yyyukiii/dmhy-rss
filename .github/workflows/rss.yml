name: Update RSS

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dmhy-rss-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate RSS
        run: python dmhy_rss.py --feed-url "https://raw.githubusercontent.com/${{ github.repository }}/main/dmhy_feed.xml"

      - name: Commit RSS feed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add dmhy_feed.xml dmhy_state.json dmhy_titles.xlsx

          git diff --cached --quiet || git commit -m "Update RSS feed and title list"

          git pull --rebase
          git push
